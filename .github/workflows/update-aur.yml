name: Check and Update AUR package

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      skip_website_check:
        description: 'Skip kryfo.app/download verification (override)'
        required: false
        default: false
        type: boolean

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{ steps.check_release.outputs.new_release }}
      version: ${{ steps.check_release.outputs.version }}
      tag: ${{ steps.check_release.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check latest Kryfo release
        id: check_release
        run: |
          LATEST_JSON=$(curl -sSL https://api.github.com/repos/GnosiWorks/Kryfo/releases/latest)
          TAG=$(echo "$LATEST_JSON" | grep -Po '"tag_name": "\K[^"]*')
          # Tag format is v0.6.2 -> strip 'v'
          VERSION=${TAG#v}

          CURRENT_VERSION=$(grep -Po '^pkgver=\K.*' PKGBUILD)

          echo "Latest upstream version: $VERSION"
          echo "Current PKGBUILD version: $CURRENT_VERSION"

          if [ "$VERSION" != "$CURRENT_VERSION" ]; then
            echo "new_release=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            echo "new_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify release on kryfo.app/download
        if: steps.check_release.outputs.new_release == 'true' && !inputs.skip_website_check
        run: |
          VERSION="${{ steps.check_release.outputs.version }}"
          echo "Checking if version $VERSION is published on https://kryfo.app/download..."
          DOWNLOAD_PAGE=$(curl -sSL https://kryfo.app/download)

          if ! echo "$DOWNLOAD_PAGE" | grep -q "kryfo-${VERSION}-beta-linux-x64.tar.gz"; then
            echo "::error::Version $VERSION is tagged on GitHub but not yet published on https://kryfo.app/download. Halting to ensure release is intended for users."
            exit 1
          fi
          echo "Version $VERSION verified on kryfo.app/download."

      - name: Fetch and verify SHA256SUMS-linux
        if: steps.check_release.outputs.new_release == 'true'
        run: |
          VERSION="${{ steps.check_release.outputs.version }}"
          TAG="${{ steps.check_release.outputs.tag }}"
          
          SUMS_URL="https://github.com/GnosiWorks/Kryfo/releases/download/${TAG}/SHA256SUMS-linux"
          echo "Fetching SHA256SUMS-linux from $SUMS_URL..."
          
          CHECKSUMS_CONTENT=$(curl -sSL -f "$SUMS_URL" || true)
          if [ -z "$CHECKSUMS_CONTENT" ]; then
            echo "::error::Could not download SHA256SUMS-linux from $SUMS_URL. Failing build as required."
            exit 1
          fi

          SHA256=$(echo "$CHECKSUMS_CONTENT" | grep "kryfo-.*-linux-x64.tar.gz" | awk '{print $1}')
          if [ -z "$SHA256" ]; then
            echo "::error::SHA256SUMS-linux does not contain checksum for linux-x64 tarball! Refusing to proceed with unverified hash."
            exit 1
          fi

          echo "Verified official SHA256: $SHA256"

          # Update PKGBUILD
          sed -i "s|^pkgver=.*|pkgver=${VERSION}|" PKGBUILD
          sed -i "s|^pkgrel=.*|pkgrel=1|" PKGBUILD
          sed -i "s|^sha256sums=.*|sha256sums=('${SHA256}')|" PKGBUILD

      - name: Regenerate .SRCINFO using Arch container
        if: steps.check_release.outputs.new_release == 'true'
        run: |
          docker run --rm -v "$(pwd):/pkg" -w /pkg archlinux:latest bash -c \
            "pacman -Syu --noconfirm pacman && useradd -m build && chown -R build . && su build -c 'makepkg --printsrcinfo' > .SRCINFO"

      - name: Commit and push changes to GitHub
        if: steps.check_release.outputs.new_release == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "chore: bump kryfo-bin to ${{ steps.check_release.outputs.version }}"
          git push

  publish-aur:
    name: Publish to AUR
    needs: check-and-update
    if: needs.check-and-update.outputs.new_release == 'true'
    environment:
      name: aur-production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish to AUR
        if: env.AUR_KEY != ''
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

          git clone ssh://aur@aur.archlinux.org/kryfo-bin.git /tmp/aur-kryfo
          cp PKGBUILD .SRCINFO /tmp/aur-kryfo/
          cd /tmp/aur-kryfo
          git config user.name "CyberPingU"
          git config user.email "cyberpingu@tuta.io"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key" git add PKGBUILD .SRCINFO
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key" git commit -m "Update to ${{ needs.check-and-update.outputs.version }}" || true
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key" git push origin master
